name: Build DPM2 Package

on:
  workflow_call:
    inputs:
      sqlite_artifact_name:
        description: "The name of the artifact containing the SQLite database."
        required: true
        type: string
      schema_artifact_name:
        description: "The name of the artifact containing the generated schema."
        required: true
        type: string
      version:
        description: "Optional version to set before building (CalVer). Default: unversioned."
        required: false
        type: string
        default: ""
    outputs:
      wheel_artifact_name:
        description: "The name of the uploaded artifact containing the built wheel."
        value: ${{ inputs.sqlite_artifact_name }}-wheel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install python
        run: uv python install

      - name: Install project
        run: uv sync --dev

      - name: Download SQLite database artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.sqlite_artifact_name }}
          path: database/

      - name: Download generated schema artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.schema_artifact_name }}
          path: schema/

      - name: Assemble dpm2 package sources
        run: |
          # The database ships LZMA-compressed: uncompressed it is ~300MB and
          # even deflated inside the wheel it exceeds PyPI's 100MB file limit.
          # dpm2 decompresses it once into a user cache dir on first use.
          rm -f projects/dpm2/src/dpm2/dpm.sqlite
          find database -name "*.sqlite" \
            -exec xz --compress --threads=0 --stdout {} \; \
            > projects/dpm2/src/dpm2/dpm.sqlite.xz
          find schema -name "*.py" -exec cp {} projects/dpm2/src/dpm2/models.py \;
          ls -la projects/dpm2/src/dpm2/dpm.sqlite.xz

      - name: Set package version
        if: inputs.version != ''
        run: uv version ${{ inputs.version }} --package dpm2

      - name: Build dpm2 wheel
        run: uv build --package dpm2 --out-dir dist-dpm2

      - name: Check wheel payload and size
        run: |
          WHEEL=$(echo dist-dpm2/*.whl)
          python - "$WHEEL" <<'PY'
          import os
          import sys
          import zipfile

          LIMIT = 100 * 1000 * 1000  # PyPI per-file limit for the dpm2 project
          wheel = sys.argv[1]
          names = zipfile.ZipFile(wheel).namelist()

          if "dpm2/dpm.sqlite.xz" not in names:
              sys.exit(f"{wheel} is missing dpm2/dpm.sqlite.xz")
          if "dpm2/dpm.sqlite" in names:
              sys.exit(f"{wheel} still bundles an uncompressed dpm2/dpm.sqlite")
          if "dpm2/models.py" not in names:
              sys.exit(f"{wheel} is missing generated dpm2/models.py")

          size = os.path.getsize(wheel)
          print(f"{wheel}: {size / 1_000_000:.1f} MB")
          if size >= LIMIT:
              sys.exit(f"wheel is {size / 1_000_000:.1f} MB, over the {LIMIT / 1_000_000:.0f} MB PyPI limit")
          PY

      - name: Test built dpm2 wheel
        shell: bash {0}
        run: |
          uv pip install --force-reinstall dist-dpm2/*.whl
          uv run --no-sync pytest projects/dpm2/tests/ -v --tb=short 2>&1 | tee /tmp/test-out.txt
          EXIT=${PIPESTATUS[0]}
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test-out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.sqlite_artifact_name }}-wheel
          path: dist-dpm2/*.whl
