[project]
name = "dpm-toolkit"
version = "0.0.0"
description = "Open-source tools and models for working with DPM databases"
authors = [{ name = "Jim Lundin", email = "jimeriklundin@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">= 3.12"

dependencies = ["cyclopts>=3.1.0", "requests>=2.32.3", "rich>=13.0.0"]

[project.scripts]
dpm-toolkit = "dpm_toolkit.cli:main"

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.13.4"]
migrate = [
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.37",
    "sqlalchemy-access>=2.0.3; sys_platform == 'win32'",
]
schema = ["jinja2>=3.1.0", "sqlalchemy>=2.0.37"]
compare = ["jinja2>=3.1.0"]
analysis = ["jinja2>=3.0", "sqlalchemy>=2.0"]

[tool.ruff]
unsafe-fixes = true

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
ignore = ["T201"]

[tool.ruff.lint.per-file-ignores]
"**/test*.py" = [
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "PLC0415", # imports at function level for test helpers
]
"**/tests/**" = [
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "PLC0415", # imports at function level for test helpers
]
"**/cli.py" = [
    "PLC0415", # imports at function level for optional dependencies
]

[tool.mypy]
strict = true

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pyrefly]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Internal module docs are for contributors, not for the installed package.
wheel-exclude = ["**/README.md"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "ruff>=0.11.4",
    "ty>=0.0.1a15",
    "pyright>=1.1.0",
    "types-beautifulsoup4>=4.12.0.20250204",
    "types-requests>=2.32.0.20250328",
    "pyrefly>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--verbose", "--import-mode=importlib"]

[tool.uv.workspace]
members = ["projects/dpm2", "projects/dpmlite"]

[tool.uv.sources]
dpm2 = { workspace = true }
dpmlite = { workspace = true }
